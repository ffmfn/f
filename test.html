<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тест: уровень групповой сплоченности</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="test-page">
    <div class="test-container">
        <header class="test-header">
            <a href="index.html" class="back-link">← К презентации</a>
            <h1>🧩 Тест на групповую сплоченность</h1>
            <p>Оцени утверждения по шкале от 1 до 5 и узнай уровень единства в твоей команде</p>
        </header>

        <form id="testForm" class="test-form"></form>

        <div class="test-actions">
            <button type="button" id="submitBtn" class="btn btn-primary" disabled>Показать результат</button>
        </div>

        <div id="result" class="result hidden">
            <h2 id="resultTitle"></h2>
            <div class="score-circle" id="scoreCircle">
                <span id="scoreValue">0</span>
                <small>из 50</small>
            </div>
            <p id="resultText"></p>
            <div class="result-actions">
                <button type="button" id="restartBtn" class="btn">Пройти ещё раз</button>
                <a href="index.html" class="btn btn-outline">← К презентации</a>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
